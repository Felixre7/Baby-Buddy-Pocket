plugins { id 'com.android.application' }

android {
    namespace 'com.babybuddypocket.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.babybuddypocket.app'
        minSdk 26
        targetSdk 36
        versionCode 17
        versionName '0.1.16'
        testInstrumentationRunner project.findProperty('liveSyncTest') == 'true' ?
            'com.babybuddypocket.app.LiveSyncInstrumentation' : 'com.babybuddypocket.app.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}

// Bundle the canonical project notices without maintaining a second license copy.
def legalAssets = layout.buildDirectory.dir('generated/legalAssets')
def copyLegalNotices = tasks.register('copyLegalNotices', Copy) {
    from(rootProject.projectDir) { include 'LICENSE', 'NOTICE' }
    into(legalAssets)
}
android.sourceSets.main.assets.srcDir(legalAssets)
tasks.named('preBuild').configure { dependsOn(copyLegalNotices) }

// One standalone runtime library for on-device QR decoding; no camera/UI framework.
dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
