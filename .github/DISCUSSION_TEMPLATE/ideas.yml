title: ""
body:
  - type: markdown
    attributes:
      value: |
        Search existing ideas first. Describe your own need in your preferred language; do not submit an AI-generated proposal. See our [contribution policy](https://github.com/Felixre7/Baby-Buddy-Pocket/blob/main/CONTRIBUTING.md#ai-usage-policy).

        Useful functionality, simplicity, reliable offline use, and few dependencies guide this project. Accepted ideas may become issues after discussion. Keep family details, credentials, server addresses, and private activity records out of this public discussion.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a real situation where the app could work better for you.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Explain the behavior you would like. A short description is enough.
  - type: textarea
    id: alternatives
    attributes:
      label: Simpler alternatives or workarounds
      description: Could an existing feature or a smaller change solve the problem?
  - type: checkboxes
    id: reporting-policy
    attributes:
      label: Before posting
      options:
        - label: I searched existing ideas and described this need myself, without an AI-written proposal.
          required: true
        - label: I removed credentials and private family information.
          required: true
